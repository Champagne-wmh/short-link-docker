server:
  port: 8080

spring:
  application:
    name: short-link
  datasource:
    # 本地 MySQL 8.0，数据库 short_link（见 db/schema.sql）
    url: jdbc:mysql://localhost:3306/short_link?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        consumer-batch-enabled: false
        batch-size: 10
        prefetch: 20

mybatis-plus:
  configuration:
    # 数据库下划线字段 <-> Java 驼峰属性 自动映射
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，方便观察执行过程（生产环境要关掉）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 短链服务自身配置
short-link:
  # 短链前缀（本地演示用 localhost；上线换成真实域名如 https://s.cn）
  domain: http://localhost:8080
  # 号段发号器每次从 DB 取多少个 ID
  id-segment-step: 1000

# Knife4j 接口文档
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn